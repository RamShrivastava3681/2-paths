# ────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — WhizUnik demo.whizunikhub.com (Static SPA + API proxy)
#
# Copy this file to your Nginx sites-available directory:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/demo
#   sudo ln -s /etc/nginx/sites-available/demo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust the server_name, SSL certificate paths, and root path below
# to match your server.
# ────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    server_name demo.whizunikhub.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.whizunikhub.com;

    # ── SSL certificates (install via Certbot / Let's Encrypt) ────────────
    ssl_certificate     /etc/letsencrypt/live/demo.whizunikhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.whizunikhub.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Frontend static files — update path to your deploy location ──────
    root /home/www/demo/frontend/dist;

    # ── Hashed assets — cache forever ─────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ── SPA fallback — serve index.html for all non-file routes ───────────
    # This lets TanStack Router handle client-side routing (e.g. /app/invoices)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Backend API — proxy to Express server (port 7979) ─────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:7979;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Allow larger request bodies (matches backend's 10mb limit)
        client_max_body_size 12m;
    }
}
